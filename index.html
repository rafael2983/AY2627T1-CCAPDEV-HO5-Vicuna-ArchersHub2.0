<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArchersHub 2.0 Charts - Group 2 Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-4">

        <div class="row g-4">

            <!-- 1. Curriculum Progress -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="chart-card">
                    <h5>Curriculum Progress</h5>
                    <p>Overall degree completion</p>

                    <div class="chart-container">
                        <canvas id="curriculumChart"></canvas>
                    </div>
                </div>
            </div>


            <!-- 2. Enlistment Status -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="chart-card">
                    <h5>Enlistment Status</h5>
                    <p>Current subject enrollment</p>

                    <div class="chart-container">
                        <canvas id="enlistmentChart"></canvas>
                    </div>
                </div>
            </div>


            <!-- 3. Academic Performance -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="chart-card">
                    <h5>Academic Performance</h5>
                    <p>GPA progression by term</p>

                    <div class="chart-container">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>

<footer>
    <h2>Rafael Vicuna, CCAPDEV SS1</h2>
</footer>

</html>
